# dsh-approval-push —— 插件自带挂载行（与 remote-access 同一约定：
# package.json 的 dsh.bundle.patch 指向本文件，profile 不需要另改 cordis.patch.yml）。
#
# 语义（与 index.js 一一对应）：
#   claimApprovals=true  有手机在线订阅才认领审批；没手机 → next()，桌面照常
#   askTimeoutMs=110000  认领后无人应答 → 不返回允许 → approval 服务归一为拒绝
#   caFile               IP 入口用私有 CA（域名入口可留空走公共链）
#   accessTokenFile      管理凭据，只走 header，不进 QR/不进手机
- insert:
    - id: dsh-approval-push
      name: '@local/dsh-approval-push'
      config:
        relayUrl: 'https://8.148.8.249:24000'
        accessTokenFile: /home/radxa/.config/dsh-forwarder/relay-access-token
        caFile: /home/radxa/project/dsh/dsh_mobile/.tls/dsh-relay-ca.crt
        # 多设备时必须显式绑定一台：留空且配对设备 >1 时插件会拒绝广播，
        # 所有卡片在 POST 之前被丢弃（见 v2 设计 / 审批推送排查记录）。
        # 这里只放通用占位值；由部署环境在 profile 的 cordis.patch.yml 覆盖。
        deviceId: ''
        claimApprovals: true
        askTimeoutMs: 110000
        pollWaitSeconds: 25
